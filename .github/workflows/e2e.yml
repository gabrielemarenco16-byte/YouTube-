name: E2E video test

# Genera un video vero su emulatore Android, estrae fotogrammi e un report.
# Chiavi: secrets del repository GEMINI_API_KEY (o GROQ_API_KEY), PEXELS_API_KEY,
# opzionali CF_ACCOUNT_ID e CF_API_TOKEN. Senza chiavi usa un copione fisso.
on:
  workflow_dispatch:
  push:
    branches: [claude/android-youtube-shorts-generator-bec0ij]

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run end-to-end test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/run-e2e.sh

      - name: Publish results to the "e2e-latest" pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p e2e-out
          (cd e2e-out && zip -r ../e2e-results.zip . -x short.mp4) || true
          gh release view e2e-latest >/dev/null 2>&1 || \
            gh release create e2e-latest --prerelease --target "$GITHUB_SHA" \
              --title "Risultati test E2E" --notes "Fotogrammi e report dell'ultimo test end-to-end."
          gh release upload e2e-latest e2e-results.zip --clobber || true
          if [ -f e2e-out/short.mp4 ]; then cp e2e-out/short.mp4 e2e-short.mp4; gh release upload e2e-latest e2e-short.mp4 --clobber || true; fi
